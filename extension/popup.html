<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>MetaGuard</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #020617;
      /* slate-950 */
      color: #f1f5f9;
      /* slate-100 */
      padding: 16px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      color: #3b82f6;
    }

    /* blue-500 */
    .card {
      background-color: rgba(15, 23, 42, 0.8);
      /* slate-900/80 */
      border: 1px solid #1e293b;
      /* slate-800 */
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .upload-area {
      border: 2px dashed #334155;
      /* slate-700 */
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .upload-area:hover {
      border-color: #3b82f6;
    }

    #file-input {
      display: none;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .status {
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 8px;
    }

    .result-score {
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      margin-top: 0;
    }

    .high-risk {
      color: #f87171;
    }

    /* red-400 */
    .med-risk {
      color: #fbbf24;
    }

    /* amber-400 */
    .low-risk {
      color: #4ade80;
    }

    /* green-400 */

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.75rem;
      border: 1px solid;
    }
  </style>
</head>

<body>
  <div class="flex items-center gap-2 mb-6 transition-transform hover:scale-[1.02] cursor-pointer">
    <div class="w-10 h-10 bg-blue-600 rounded-xl shadow-md flex items-center justify-center text-white shrink-0">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="m9 12 2 2 4-4" />
      </svg>
    </div>
    <div class="flex text-2xl font-semibold tracking-tight">
      <span class="text-white">Meta</span><span class="text-blue-500">Guard</span>
    </div>
  </div>

  <div id="upload-view" class="card">
    <p style="font-size: 0.875rem; color: #cbd5e1; margin-top: 0;">Analyze files before sharing them.</p>

    <label class="upload-area">
      <div>Drop a file or click</div>
      <div style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">JPG, PNG, PDF, DOCX...</div>
      <input type="file" id="file-input" />
    </label>

    <div id="file-details" class="hidden" style="margin-top: 12px; font-size: 0.875rem; text-align: center;">
      <div id="filename" style="font-weight: 500; margin-bottom: 4px;"></div>
      <label
        style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.75rem; color: #94a3b8; margin-bottom: 12px; margin-top: 8px;">
        <input type="checkbox" id="share-safe-checkbox">
        Share-safe mode (Images)
      </label>
      <button id="analyze-btn" class="btn">Analyze & Clean</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div id="result-view" class="card hidden">
    <button id="back-btn"
      style="background: none; border: none; color: #cbd5e1; cursor: pointer; padding: 0; margin-bottom: 12px; font-size: 0.875rem;">&larr;
      Start Over</button>
    <div style="text-align: center;">
      <div
        style="font-size: 0.875rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">
        Privacy Score</div>
      <div id="score-display" class="result-score"></div>
      <div id="risk-display" class="pill" style="margin-bottom: 16px;"></div>
    </div>
    <div id="meta-count" style="font-size: 0.875rem; text-align: center; color: #cbd5e1; margin-bottom: 16px;"></div>
    <a id="download-link" class="btn" style="text-decoration: none; box-sizing: border-box;" target="_blank">Download
      Clean File</a>
  </div>

  <script src="popup.js"></script>
</body>

</html>
